name: nanexus-event-intelligence

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nanexus
      POSTGRES_USER: nanexus
      POSTGRES_PASSWORD: nanexus
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nanexus -d nanexus"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:6379:6379"

  backend:
    build:
      context: ./backend
      target: development
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nanexus:nanexus@postgres:5432/nanexus
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:ro
    ports:
      # v0.1.0 has no built-in authentication; never expose this port publicly.
      - "8000:8000"

  frigate-ingest-worker:
    profiles: ["frigate"]
    build:
      context: ./backend
      target: development
    command: ["uv", "run", "--no-sync", "frigate-live-ingest"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nanexus:nanexus@postgres:5432/nanexus
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:ro

  pipeline-worker:
    build:
      context: ./backend
      target: development
    command: ["uv", "run", "--no-sync", "nanexus-pipeline-worker"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://nanexus:nanexus@postgres:5432/nanexus
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src:ro

  web:
    build:
      context: ./web
      target: development
    environment:
      VITE_API_BASE_URL: ""
      VITE_API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend
    volumes:
      - ./web/src:/app/src:ro
      - ./web/index.html:/app/index.html:ro
    ports:
      # v0.1.0 has no built-in authentication; never expose this port publicly.
      - "5173:5173"

volumes:
  postgres-data:
  redis-data:

