name: Documentation issue / 文档问题
description: Report missing, incorrect or unclear documentation / 报告缺失、错误或不清楚的文档
title: "[Docs]: "
labels: ["documentation"]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: Pre-submission checks / 提交前检查
      options:
        - label: I searched existing issues and found no duplicate. / 我已搜索已有 Issue，没有发现重复问题。
          required: true
        - label: My report contains no credentials, private endpoints or personal data. / 报告不含凭据、私有地址或个人数据。
          required: true
  - type: input
    id: location
    attributes:
      label: Page or section / 页面或章节
      description: Link the file, heading or public URL when possible.
      placeholder: README.md — Try the Community Demo
    validations:
      required: true
  - type: dropdown
    id: language
    attributes:
      label: Language / 语言
      options:
        - English
        - 简体中文
        - Both / 两者
        - Not language-specific / 与语言无关
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is missing, incorrect or unclear? / 哪些内容缺失、错误或不清楚？
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement / 修改建议
      description: Proposed wording or structure is welcome but not required.
